[tool.poetry]
name = "lighthouse"
version = "0.1.0"
description = "AI Agent Auditing System — meta-agentic infrastructure that stress-tests and red-teams AI agents."
authors = ["Suman"]
license = "MIT"
readme = "README.md"
packages = [{ include = "lighthouse" }]

[tool.poetry.dependencies]
python = "^3.11"

# LLM
anthropic = "^0.26.0"

# Structured output extraction from LLM responses
instructor = "^1.3.0"

# Data validation
pydantic = "^2.7.0"

# Templating (HTML dashboard)
jinja2 = "^3.1.4"

# HTTP client (for API adapter)
httpx = "^0.27.0"

# CLI interface
click = "^8.1.7"

# Rich terminal output
rich = "^13.7.1"


[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"

# Linting / formatting
ruff = "^0.4.0"
mypy = "^1.10.0"


[tool.poetry.scripts]
lighthouse = "lighthouse.cli:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
